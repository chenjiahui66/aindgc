spring:
  config:
    # Local, gitignored secrets file. Lets the app boot from the IDE or
    # `mvn spring-boot:run` without exporting DB_USER/DB_PASS by hand.
    # Both paths are listed so it works whether the working directory is
    # `backend/` or the repository root. `optional:` means a missing file
    # is not an error — real deployments inject real env vars instead.
    import: "optional:file:.env[.properties],optional:file:backend/.env[.properties]"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding must be a *Java* charset name (UTF-8), not the MySQL
    # charset name utf8mb4 — the driver rejects it with
    # "Unsupported character encoding 'utf8mb4'".
    # connectionCollation is what actually pins the server-side collation.
    url: jdbc:mysql://127.0.0.1:3306/aindgc?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:aindgc}
    password: ${DB_PASS:}

logging:
  level:
    com.aindgc.ai: DEBUG
    org.springframework.web: INFO
