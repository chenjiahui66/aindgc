# =====================================================================
# Aindgc — Docker Compose
#
# Topology: 2 containers, no database container.
#
#   web (nginx, 80)  ──proxies /api──▶  backend (Spring Boot, 8080)
#                                          │
#                                          └── H2 file db in volume
#                                              "aindgc-data:/data"
#
# Why no MySQL container: the target host has ~1.6 GB RAM. A MySQL
# container costs 400-500 MB resident for a database that is a few MB.
# H2 runs inside the backend JVM, so the whole stack is ~700 MB.
# This was verified locally against the full 48-check smoke suite.
#
# Usage:
#   cd deploy/docker
#   cp .env.example .env          # then edit the secrets
#   docker compose up -d --build
# =====================================================================

services:
  backend:
    build:
      # Repo root, so the Dockerfile can COPY backend/target/*.jar
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: aindgc/backend:latest
    container_name: aindgc-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: h2
      AINDGC_DATA_DIR: /data
      AINDGC_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AINDGC_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aindgc.com}
      AINDGC_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      AINDGC_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    volumes:
      - aindgc-data:/data
    # Not published to the host: only the nginx container needs to reach it.
    expose:
      - "8080"
    networks:
      - aindgc
    deploy:
      resources:
        limits:
          memory: 700M

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    image: aindgc/web:latest
    container_name: aindgc-web
    restart: unless-stopped
    volumes:
      # Serve dist straight off the host instead of baking it into the image.
      # This is what makes a release a pure file upload: rsync the new dist/
      # over this directory and nginx picks it up immediately, with no
      # `docker compose build`, no container recreate, and no window where the
      # site is down.
      #
      # The image still COPYs a dist (see frontend.Dockerfile) so a container
      # started without this mount still serves a working site rather than a
      # bare 403.
      - ../../frontend/dist:/usr/share/nginx/html:ro
    ports:
      # 443 is published even in HTTP-only mode. nginx simply is not listening
      # on it yet, which is harmless — but the port must be mapped BEFORE the
      # HTTPS switch, otherwise the container listens on 443 and the host
      # silently refuses to forward to it.
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aindgc
    deploy:
      resources:
        limits:
          memory: 96M

networks:
  aindgc:
    driver: bridge

volumes:
  # The H2 database. NEVER use `docker compose down -v` — it deletes this.
  aindgc-data:
    driver: local
