# Aindgc — nginx site config (runs inside the frontend container)
#
# default_server is intentional: this container owns :80 on the host and
# should answer anything that does not match a more specific server block.
# A previous deployment on this host was broken for hours by a leftover
# aitools.conf that also claimed default_server and swallowed every request.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded assets are content-hashed by Vite — safe to cache forever.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached, or clients keep loading a stale
    # bundle hash after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Sitemap / robots are served by the backend.
    location = /sitemap.xml { proxy_pass http://backend:8080; }
    location = /robots.txt  { proxy_pass http://backend:8080; }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    # Static .html must be served as-is, never SPA-fallbacked.
    # try_files $uri =404 means a missing file returns a real 404 instead of
    # silently falling through to /index.html — which would hand the client the
    # homepage HTML with a 200. That silently broke Google Search Console
    # HTML-file verification, which fetches the token file and reads the
    # google-site-verification meta tag.
    location ~* \.html$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
