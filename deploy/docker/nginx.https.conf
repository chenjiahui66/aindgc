# Aindgc — nginx site config (runs inside the frontend container)
#
# default_server is intentional: this container owns :80 and :443 on the host
# and should answer anything that does not match a more specific server block.
# A previous deployment on this host was broken for hours by a leftover
# aitools.conf that also claimed default_server and swallowed every request.
#
# ── Port 80  : ACME HTTP-01 challenge ONLY, everything else → 443
# ── Port 443 : the real site (SPA + /api proxy)
#
# Cert paths are bind-mounted from ./certs/conf, which the certbot service
# writes to. Until a certificate exists, bring the site up in HTTP-only mode
# (see compose profiles) — nginx refuses to start with missing cert files.

# ---------------------------------------------------------------- 80: ACME
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The HTTP-01 challenge must be served over plain HTTP, so it is
    # explicitly exempt from the HTTPS redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------- 443: site
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # nginx >= 1.25 wants the standalone `http2 on;` rather than `ssl http2`
    # in the listen directive. This image is 1.27-alpine.
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/aindgc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aindgc/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames — safe to cache forever.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached or clients keep loading a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Sitemap / robots come from the backend.
    location = /sitemap.xml { proxy_pass http://backend:8080; }
    location = /robots.txt  { proxy_pass http://backend:8080; }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static .html must be served as-is, never SPA-fallbacked.
    # try_files $uri =404 means a missing file returns a real 404 instead of
    # silently falling through to /index.html — which would hand the client the
    # homepage HTML with a 200. That silently broke Google Search Console
    # HTML-file verification, which fetches the token file and reads the
    # google-site-verification meta tag.
    location ~* \.html$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
