# =====================================================================
# Aindgc · Local development nginx config
#
# Usage (Linux/macOS):
#   sudo cp deploy/nginx.dev.conf /etc/nginx/sites-available/aindgc.dev
#   sudo ln -s /etc/nginx/sites-available/aindgc.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then visit:
#   http://aindgc.local              # frontend dev (proxied to Vite :5173)
#   http://aindgc.local/api/health   # backend health (proxied to Spring Boot :8080)
#
# Add to /etc/hosts:
#   127.0.0.1 aindgc.local
# =====================================================================

server {
    listen       80;
    server_name  aindgc.local;

    # Vite dev server
    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Vite HMR)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploads (when using local file storage)
    location /uploads/ {
        alias /opt/aindgc/uploads/;
        expires 7d;
        access_log off;
    }

    access_log /var/log/nginx/aindgc.dev.access.log;
    error_log  /var/log/nginx/aindgc.dev.error.log;
}
